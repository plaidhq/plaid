# GPUI app (app/): Windows build, tests (including the mock-endpoint replay) and an unsigned exe artifact; the same
# on an Intel Mac, plus ui-check renders. Apple silicon macOS is built and tested locally.
name: app

on:
  push:
    branches: [main]
    paths: [app/**, .github/workflows/app.yml]
  pull_request:
    paths: [app/**, .github/workflows/app.yml]
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo build --release -p plaid
      # Launch the GUI exe for real: it must stay up, log its launch and not panic (a panic shows a message box
      # and blocks, so liveness alone proves nothing).
      - name: Launch smoke test
        shell: pwsh
        run: |
          $env:PLAID_DATA_DIR = "$env:RUNNER_TEMP\plaid-smoke"
          $p = Start-Process target\release\plaid.exe -PassThru
          Start-Sleep -Seconds 8
          $log = Get-Content "$env:PLAID_DATA_DIR\events.log" -Raw -ErrorAction SilentlyContinue
          Write-Output $log
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          if (-not $alive) { throw "plaid.exe exited with $($p.ExitCode)" }
          if ($log -notmatch 'launch ') { throw 'no launch line in events.log' }
          if ($log -match 'panic:') { throw 'panicked' }
      - uses: actions/upload-artifact@v4
        with:
          name: plaid-windows-x64
          path: app/target/release/plaid.exe
          if-no-files-found: error

  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cargo test --workspace
      - run: ./bundle.sh release
      - name: Intel binary for macOS 13
        run: |
          BIN=target/Plaid.app/Contents/MacOS/plaid
          lipo -archs "$BIN" | grep -qx x86_64
          vtool -show-build "$BIN" | grep -q 'minos 13.0'
      # Same as the Windows smoke test: the app must stay up, log its launch (after the GPUI windows open) and not panic.
      - name: Launch smoke test
        run: |
          export PLAID_DATA_DIR="$RUNNER_TEMP/plaid-smoke"
          target/Plaid.app/Contents/MacOS/plaid &
          PID=$!
          sleep 8
          cat "$PLAID_DATA_DIR/events.log" || true
          kill -0 $PID || { echo "plaid exited"; exit 1; }
          kill $PID
          grep -q 'launch ' "$PLAID_DATA_DIR/events.log"
          ! grep -q 'panic:' "$PLAID_DATA_DIR/events.log"
      - run: ditto -c -k --keepParent target/Plaid.app Plaid-macos-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: plaid-macos-x64
          path: app/Plaid-macos-x64.zip
          if-no-files-found: error
      # Offscreen renders of every settings page; the runner's GPU may not support them, so a failure here is only
      # reported.
      - name: ui-check
        continue-on-error: true
        run: |
          cargo build -p plaid --features snapshot
          PLAID_DATA_DIR="$RUNNER_TEMP/uicd" ./target/debug/plaid --ui-check "$RUNNER_TEMP/uic"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-check-macos-x64
          path: ${{ runner.temp }}/uic
          if-no-files-found: ignore
