[package]
name = "plaid-spike"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
futures-util = "0.3.34"
hound = "3.5.1"
serde_json = "1.0.154"
tauri = { version = "=2.12.5", features = ["macos-private-api"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
uuid = { version = "1.29.3", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
security-framework = "3.7.0"
tauri-nspanel = "=2.1.1"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

