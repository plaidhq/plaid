[package]
name = "plaid"
version.workspace = true
edition.workspace = true

[dependencies]
plaid-core = { path = "../core" }
gpui-kit = "=0.10.0"
raw-window-handle = "0.6"
tray-icon = "=0.26.1"
async-channel = "2.5"
async-io = "2.6"
serde_json = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
cpal = "=0.18.2"
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[features]
# Offscreen PNG renders of the settings pages (`plaid --snapshot`).
snapshot = ["gpui-kit/test-support", "dep:image"]

[dev-dependencies]
async-tungstenite = { version = "0.35", default-features = false, features = ["handshake"] }
futures-util = "0.3.34"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["objc2-core-graphics"] }
objc2-foundation = "0.3"
security-framework = "3.7"
core-foundation = "=0.10.1"
core-graphics = "=0.25.0"
foreign-types = "0.5"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
