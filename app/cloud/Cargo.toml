[package]
name = "plaid-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
plaid-core = { path = "../core" }
async-channel = "2.5"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures-util = "0.3.34"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2", "socks"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
uuid = { version = "1.29", features = ["v4"] }

[dev-dependencies]
async-io = "2.6"
async-tungstenite = { version = "0.35", default-features = false, features = ["handshake"] }
tokio = { version = "1", features = ["io-util"] }
