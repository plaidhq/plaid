[package]
name = "plaid-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
icu_segmenter = { version = "2.4", default-features = false, features = ["compiled_data"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
unicode-properties = "0.1.5"
unicode-segmentation = "1.13"
async-channel = "2.5"
async-io = "2.6"
async-tungstenite = { version = "0.35", default-features = false, features = ["handshake", "futures-03-sink", "smol-runtime", "smol-native-tls"] }
futures-util = "0.3.34"
uuid = { version = "1.29", features = ["v4"] }
earshot = "1.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
ureq = { version = "=3.5.2", default-features = false, features = ["native-tls-no-default"] }
